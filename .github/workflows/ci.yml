name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harrancraft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-2025
            python: "3.13"
    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Record interpreter
        run: python -VV
      - name: Verify source and contracts
        run: python tools/verify.py
      - name: Build and verify installed package
        run: python tools/package.py
      - name: Compare native Windows version metadata
        if: runner.os == 'Windows'
        run: python tools/windows_smoke.py

  bridge:
    name: Ubuntu / Java and C++ bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify Java and C++ bridge processes
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/javac"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python tools/test_bridge.py --hc-timeout 600

  bridge-windows:
    name: Windows / MinGW Java and C++ bridge
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify native Windows bridge processes
        shell: pwsh
        run: |
          $jdk = $env:JAVA_HOME_21_X64
          if (-not $jdk -or -not (Test-Path (Join-Path $jdk 'bin/javac.exe'))) {
            throw 'JDK 21 is not available'
          }
          $compiler = (Get-Command g++.exe -ErrorAction Stop).Source
          $generator = (Get-Command ninja.exe -ErrorAction Stop).Source
          $target = & $compiler -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target -notmatch '^x86_64-.*mingw') {
            throw 'A native Windows x64 MinGW compiler is required'
          }
          $env:CXX = $compiler
          $env:CMAKE_GENERATOR = 'Ninja'
          $env:JAVA_HOME = $jdk
          $env:Path = "$(Join-Path $jdk 'bin');$env:Path"
          python tools/test_bridge.py --hc-timeout 900
      - name: Inspect Windows bridge failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem 'reports/validation' -Recurse -Filter 'result.json' | ForEach-Object {
            $data = Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json
            Write-Output ("status={0} reason={1} failed_stage={2}" -f $data.status, $data.reason, $data.failed_stage)
            foreach ($stage in $data.stages) {
              Write-Output ("stage={0} status={1} exit={2} reason={3}" -f $stage.name, $stage.status, $stage.exit_code, $stage.reason)
              if ($stage.status -ne 'passed') {
                Write-Output ("cleanup={0} descendants_terminated={1} error_type={2} cleanup_error_type={3} elapsed_seconds={4}" -f $stage.cleanup, $stage.descendants_terminated, $stage.error_type, $stage.cleanup_error_type, $stage.elapsed_seconds)
                $metadata = Join-Path $_.DirectoryName ($stage.name + '.process.json')
                if (Test-Path -LiteralPath $metadata) {
                  $process = Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json
                  Write-Output ("supervisor_exit={0} supervisor_cleanup={1} supervisor_descendants={2} supervisor_error={3}" -f $process.exit_code, $process.cleanup, $process.descendants_terminated, $process.error_type)
                }
                if ($stage.remaining_processes) {
                  Write-Output ("remaining_processes=" + ($stage.remaining_processes -join ','))
                }
              }
              if ($stage.status -ne 'passed' -and $stage.stderr) {
                $log = Join-Path $_.DirectoryName $stage.stderr
                if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 60 }
              }
            }
          }
