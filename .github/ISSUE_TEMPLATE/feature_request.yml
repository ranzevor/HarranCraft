name: Feature proposal / 功能提案
description: Propose a concrete behavior / 提出具体能力需求
body:
  - type: textarea
    id: problem
    attributes:
      label: Task and current limitation / 任务与当前缺口
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Required behavior and acceptance / 所需行为与验收
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility / 替代方案与兼容影响
